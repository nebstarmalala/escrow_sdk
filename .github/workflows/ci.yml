name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The spec here is a copy of the backend's frozen contract, and the generated
  # types are committed rather than built on install. Both are conveniences that
  # rot silently, so they get their own job and it runs first.
  spec:
    name: spec and generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run spec:check
        working-directory: packages/typescript
      - run: npm run generate:check
        working-directory: packages/typescript
      # The PHP shapes come from the same spec through a different generator,
      # so they can drift independently of the TypeScript ones.
      - run: npm ci
        working-directory: packages/php
      - run: npm run generate:check
        working-directory: packages/php

  typescript:
    name: typescript (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the declared floor - the version where global fetch became
        # available without a flag, which is why the package has no HTTP
        # dependency at all.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run typecheck
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript
      # An example that does not compile is worse than no example: it is a
      # confident-looking wrong answer, and it is the first thing an integrator
      # copies.
      # Run from the package, whose node_modules holds tsc and @types/node. The
      # example has no install of its own, which is the point of it.
      - run: npx tsc --noEmit -p ../../examples/typescript-node/tsconfig.json
        working-directory: packages/typescript

  php:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: packages/php
      - run: vendor/bin/phpunit
        working-directory: packages/php
      - run: php -l ../../examples/php-plain/checkout.php && php -l ../../examples/php-plain/webhook.php
        working-directory: packages/php
      # One PHP version is enough for static analysis; running it four times
      # tells you the same thing four times.
      - if: matrix.php == '8.1'
        # The default 128M is not enough once the generated array shapes are
        # in scope; PHPStan crashes its worker rather than reporting a limit.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
        working-directory: packages/php
